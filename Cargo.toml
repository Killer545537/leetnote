[package]
name = "leetnote"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }

anyhow = "1.0.104"
thiserror = "2.0.21"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.13.5", features = ["json"] }
url = "2.5.8"
htmd = "0.5.6"
regex = "1.13.1"
serde_yaml = "0.9.34"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
