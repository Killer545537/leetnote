name: Format

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check
