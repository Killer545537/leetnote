name: Test

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Tests never call the real `fm` (macOS 27+ only): they use a mock script and a mock normalizer,
    # so any Unix runner works. The mock needs a POSIX shell, hence not Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
