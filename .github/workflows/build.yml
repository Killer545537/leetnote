name: Build

on:
  push:
    branches: [dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # leetnote shells out to Apple's `fm`, so macOS is the platform that matters.
    # The runner doesn't need `fm` itself; it's only invoked at runtime.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
